<body>
  <header class="gate-header"><a href="/">← 回到博客</a><span>一封晴天来信 ✳</span></header>
  <main class="gate-main">

    <div class="gate-art" aria-hidden="true"><svg viewBox="0 0 300 225"><circle cx="152" cy="108" r="87" fill="#e8ebdf"/><g class="sun"><circle cx="221" cy="55" r="22" fill="#e6c286"/><path d="M221 23v-8m0 80v-8m-32-32h-8m80 0h-8m-55-23-6-6m52 52 6 6m-52-6-6 6m52-52 6-6" stroke="#d7ba80" stroke-width="2" stroke-linecap="round"/></g><g class="floating-heart"><rect x="68" y="84" width="162" height="104" rx="8" fill="#fffaf0" stroke="#a4af91" stroke-width="2"/><path d="M72 89l77 57 77-57M72 182l58-53m96 53-57-53" stroke="#a4af91" stroke-width="2" fill="none"/><circle cx="149" cy="143" r="17" fill="#e4c397"/><path d="M149 154v-20m0 12q-11-1-9-10 9 0 9 10m0-3q11 0 9-9-9 0-9 9" fill="none" stroke="#8c9b75" stroke-width="2"/></g><path d="M48 180v-34m0 18q-19 0-16-13 14 0 16 13m0-10q17 0 15-13-13 0-15 13" fill="none" stroke="#a1af8a" stroke-width="2"/><path d="M244 153l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#b4bd9d"/></svg></div>
    <h1>这里留了一点晴天，<br>等一句<span class="gate-underline">小暗号</span>。</h1>
    <p class="gate-intro">有些话，想留给知道暗号的你。<br>不着急，轻轻敲门就好。</p>
    <form id="gate-form" class="gate-form">
      <label for="passphrase">我们说好的那句小暗号</label>
      <div class="password-field"><input id="passphrase" name="passphrase" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="把小暗号写在这里" required maxlength="256" aria-describedby="gate-status"><button id="toggle-password" type="button" aria-label="显示暗号" aria-pressed="false">显示</button></div>
      <p id="gate-status" class="gate-status" role="status" aria-live="polite">这封信已经准备好了，慢慢来。</p>
      <button id="unlock" class="primary" type="submit">带着一点期待，开门 <span>↗</span></button>
    </form>
    <p class="handwritten gate-footnote">希望你打开时，心情也刚好是晴天。</p>
    <noscript><p class="gate-status">请开启浏览器的 JavaScript，让这封小信为你展开。</p></noscript>
  </main>
  <footer class="gate-footer"><span>A LITTLE COURAGE, A LITTLE WARMTH</span><p>把温柔藏进一封信里。</p></footer>
